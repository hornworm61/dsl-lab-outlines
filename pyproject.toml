[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "outlines-lab"
version = "0.1.0"
description = "Illustrative DSL-mediated agents: grammar masking, validation, and human review"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "LICENSES/*.txt"]
requires-python = ">=3.11"
dependencies = [
    "lark==1.3.1",
    "llguidance==1.3.0",
    "numpy>=2,<3",
    "outlines==1.2.9",
]

[project.optional-dependencies]
local = ["transformers==4.57.6", "torch==2.8.0"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
outlines-lab = "outlines_lab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/outlines_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
